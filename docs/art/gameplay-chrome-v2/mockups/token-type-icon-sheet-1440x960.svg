opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><text x="658" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">default</text><rect x="730" y="470" width="120" height="44" rx="8" fill="#51331d" stroke="#f0cb66" stroke-width="1.5"/><g transform="translate(742 482) scale(1)" fill="none" stroke="#fff1ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c4-7 7 1 14-11"/><path d="M14 5h3v3"/></g><text x="770" y="498" fill="#fff1ca" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><text x="790" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">hover</text><rect x="862" y="470" width="120" height="44" rx="8" fill="#21150d" stroke="#f0cb66" stroke-width="1.5"/><g transform="translate(874 482) scale(1)" fill="none" stroke="#f3e5c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c4-7 7 1 14-11"/><path d="M14 5h3v3"/></g><text x="902" y="498" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><text x="922" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">pressed</text><rect x="991" y="467" width="126" height="50" rx="11" fill="none" stroke="#f0cb66" stroke-opacity=".38" stroke-width="1.5"/><rect x="994" y="470" width="120" height="44" rx="8" fill="#51331d" stroke="#f0cb66" stroke-width="1.5"/><g transform="translate(1006 482) scale(1)" fill="none" stroke="#f3e5c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c4-7 7 1 14-11"/><path d="M14 5h3v3"/></g><text x="1034" y="498" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><text x="1054" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">selected</text><rect x="1126" y="470" width="120" height="44" rx="8" fill="#33291f" stroke="#796f61" stroke-width="1.5"/><g transform="translate(1138 482) scale(1)" fill="none" stroke="#b4aa9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c4-7 7 1 14-11"/><path d="M14 5h3v3"/></g><text x="1166" y="498" fill="#b4aa9a" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><path d="M9 9l26 26" stroke="#b4aa9a" stroke-opacity=".45" stroke-width="1.5"/><text x="1186" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">disabled</text><rect x="1254" y="466" width="128" height="52" rx="12" fill="none" stroke="#f6db83" stroke-width="2"/><rect x="1258" y="470" width="120" height="44" rx="8" fill="#3a2416" stroke="#f6db83" stroke-width="1.5"/><g transform="translate(1270 482) scale(1)" fill="none" stroke="#f3e5c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c4-7 7 1 14-11"/><path d="M14 5h3v3"/></g><text x="1298" y="498" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="13" font-weight="700">Course</text><text x="1318" y="544" fill="#b9a47b" opacity="1" text-anchor="middle" font-family="Cabin, Trebuchet MS, sans-serif" font-size="11" font-weight="600" letter-spacing=".8">focus</text><text x="48" y="620" fill="#f0cb66" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="700">Surface</text><text x="202" y="620" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Parchment is the warm readable surface. Wood is the quiet frame. No gold panel fields.</text><path d="M48 637h1342" stroke="#cbb17a" stroke-opacity=".2"/><text x="48" y="679" fill="#f0cb66" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="700">Action</text><text x="202" y="679" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="400">One token: --color-action = #c8962c. Brass is selected/focus punctuation, never a second action color.</text><path d="M48 696h1342" stroke="#cbb17a" stroke-opacity=".2"/><text x="48" y="738" fill="#f0cb66" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="700">Targets</text><text x="202" y="738" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Every direct manipulation target is at least 44 × 44 CSS px. Safe-area padding attaches to HUD, dock and sheets.</text><path d="M48 755h1342" stroke="#cbb17a" stroke-opacity=".2"/><text x="48" y="797" fill="#f0cb66" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="700">States</text><text x="202" y="797" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="400">Hover brightens; pressed deepens; selected gets two rings; focus is an external 2 px outline; disabled adds slash + lower contrast.</text><path d="M48 814h1342" stroke="#cbb17a" stroke-opacity=".2"/><text x="48" y="856" fill="#f0cb66" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="700">Parity</text><text x="202" y="856" fill="#f3e5c2" opacity="1" text-anchor="start" font-family="Cabin, Trebuchet MS, sans-serif" font-size="14" font-weight="400">GameScreen and MatchScreen share tokens, icon buttons, HUD order, notices, dock hierarchy and accessible labels; actions remain unchanged.</text><path d="M48 873h1342" stroke="#cbb17a" stroke-opacity=".2"/></svg>
